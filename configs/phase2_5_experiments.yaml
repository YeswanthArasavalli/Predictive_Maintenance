    temporal_family: combined
    temporal_windows: [5]
    temporal_lags: [5]
    temporal_n_monitors: 8
    hyperparameters: { max_iter: 200, learning_rate: 0.1, class_weight: balanced }
    description: "Horizon sensitivity: combined temporal features at H=14."

  - experiment_id: FR25_T4_combined_cyc_H50
    task: B_FAILURE_RISK
    model: hist_gb_classifier
    feature_config: A
    normalization_mode: B
    include_cycle: true
